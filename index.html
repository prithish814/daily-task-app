<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<!-- Mobile responsive settings -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Daily Tasks</title>

<!-- Connect CSS -->
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<div class="container">

    <h1>My Daily Tasks</h1>

    <p id="today-date"></p>

    <!-- Task Input Section -->
    <div class="task-input">

        <input
            type="text"
            id="task-input"
            placeholder="Enter your task..."
        >

        <button id="add-btn">Add</button>

    </div>

<!-- Dashboard Section -->
<div class="dashboard">

    <h2>Today's Progress</h2>

    <div class="stats">

        <div class="stat-box">
            <h3 id="completed-count">0</h3>
            <p>Completed</p>
        </div>

        <div class="stat-box">
            <h3 id="remaining-count">0</h3>
            <p>Remaining</p>
        </div>

        <div class="stat-box">
            <h3 id="score">0%</h3>
            <p>Score</p>
        </div>

    </div>

    <!-- Progress Bar -->
    <div class="progress-container">

        <div id="progress-bar"></div>

    </div>

</div>


<!-- Task Section -->
<div class="task-section">

    <h2>Today's Tasks</h2>

    <ul id="task-list"></ul>

</div>

</div>

<!-- Connect JavaScript -->
<script src="script.js"></script>

</body>

</html>
